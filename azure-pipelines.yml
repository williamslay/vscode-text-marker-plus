trigger:
  tags:
    include:
      - 'v*'

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm install -g @vscode/vsce
    displayName: 'Install vsce'

  - task: AzureCLI@2
    displayName: 'Publish to VS Code Marketplace'
    inputs:
      azureSubscription: 'vscode-marketplace-wif'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        vsce publish --azure-credential