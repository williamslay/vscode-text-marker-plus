trigger:
  branches:
    include:
      - master
  tags:
    include:
      - 'v*'

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: |
      npm install -g yarn@1.22.22
      yarn --version
    displayName: 'Set up Yarn'

  - script: yarn install --frozen-lockfile
    displayName: 'Install dependencies'

  - script: yarn run check
    displayName: 'Compile, lint and test'

  - script: |
      yarn vsce ls
      yarn vsce package --out text-marker-plus.vsix
    displayName: 'Validate and package extension'

  - task: AzureCLI@2
    displayName: 'Publish to VS Code Marketplace'
    condition: and(
      succeeded(),
      startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
      )
    inputs:
      azureSubscription: 'vscode-marketplace-wif'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        yarn vsce publish \
          --packagePath text-marker-plus.vsix \
          --azure-credential
